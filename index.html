/* ---------- 常量 ---------- */
const NS = 'englishCoach';
const PANEL_ID = 'english-coach';
const STORE_KEY = 'dsh.english-coach.v1';
const DEFAULT_EXAM = '2027-04-11';
const BOX_DAYS = [0, 1, 2, 4, 7, 15, 30];
const DAY = 86400000;

const GRAMMAR = GRAMMAR_A.concat(GRAMMAR_B);

/* ---------- 基础工具 ---------- */
function pad2(n) { return n < 10 ? '0' + n : String(n); }
function dayKey(date) {
  const d = date || new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}
function daysUntil(dateStr) {
  const parts = String(dateStr || '').split('-');
  if (parts.length !== 3) return null;
  const target = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
  if (isNaN(target.getTime())) return null;
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.round((target.getTime() - today.getTime()) / DAY);
}
function shuffleSeed(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function todaySeed() {
  const d = new Date();
  return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
}
function shuffled(list, seed) {
  const rnd = shuffleSeed(seed);
  return list.map(function (x) { return { x: x, r: rnd() }; })
    .sort(function (a, b) { return a.r - b.r; })
    .map(function (o) { return o.x; });
}
function fmtMinutes(sec) {
  const m = Math.floor((sec || 0) / 60);
  if (m < 60) return m + ' 分钟';
  return Math.floor(m / 60) + ' 小时 ' + (m % 60) + ' 分';
}
function clamp(n, a, b) { return Math.max(a, Math.min(b, n)); }

/* ---------- 状态 ---------- */
function emptyDay() {
  return { newWords: 0, reviews: 0, grammar: 0, speaking: 0, minutes: 0 };
}
function defaultState() {
  return {
    v: 1,
    examDate: DEFAULT_EXAM,
    target: 140,
    words: {},
    daily: {},
    grammar: {},
    speaking: {},
    papers: [],
    writing: {},
    placement: null,
    settings: { dailyNew: 20, rate: 0.9, theme: 'light' },
    createdAt: Date.now(),
  };
}
function loadState() {
  const base = defaultState();
  try {
    const raw = window.localStorage.getItem(STORE_KEY);
    if (!raw) return base;
    const saved = JSON.parse(raw);
    if (!saved || typeof saved !== 'object') return base;
    return {
      v: 1,
      examDate: typeof saved.examDate === 'string' ? saved.examDate : base.examDate,
      target: typeof saved.target === 'number' ? saved.target : base.target,
      words: saved.words && typeof saved.words === 'object' ? saved.words : {},
      daily: saved.daily && typeof saved.daily === 'object' ? saved.daily : {},
      grammar: saved.grammar && typeof saved.grammar === 'object' ? saved.grammar : {},
      speaking: saved.speaking && typeof saved.speaking === 'object' ? saved.speaking : {},
      papers: Array.isArray(saved.papers) ? saved.papers : [],
      writing: saved.writing && typeof saved.writing === 'object' ? saved.writing : {},
      placement: saved.placement || null,
      settings: (function () {
        const merged = Object.assign({}, base.settings, saved.settings || {});
        if (merged.theme !== 'dark' && merged.theme !== 'light') merged.theme = 'light';
        return merged;
      })(),
      createdAt: saved.createdAt || Date.now(),
    };
  } catch (err) { return base; }
}
function saveState(state) {
  try { window.localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (err) { /* ignore */ }
}
function dayOf(state, key) {
  return Object.assign(emptyDay(), state.daily[key] || {});
}
function streakOf(state) {
  let n = 0;
  const d = new Date();
  const has = function (dt) {
    const rec = state.daily[dayKey(dt)];
    return rec && (rec.newWords || rec.reviews || rec.grammar || rec.speaking);
  };
  if (!has(d)) d.setDate(d.getDate() - 1);
  let guard = 0;
  while (guard < 500) {
    if (!has(d)) break;
    n += 1; guard += 1;
    d.setDate(d.getDate() - 1);
  }
  return n;
}

/* ---------- 词汇 SRS ---------- */
function wordCard(state, w) { return state.words[w] || null; }
function dueWords(state, now) {
  const t = now || Date.now();
  return Object.keys(state.words).filter(function (w) {
    const c = state.words[w];
    return c && c.due && c.due <= t;
  });
}
function learntCount(state) { return Object.keys(state.words).length; }
function newWordPool(state) {
  const learnt = state.words;
  return WORDS.filter(function (o) { return !learnt[o.w]; });
}
function todayNewQueue(state) {
  const target = state.settings.dailyNew || 20;
  const pool = newWordPool(state);
  const today = dayOf(state, dayKey());
  const remain = Math.max(0, target - today.newWords);
  return shuffled(pool, todaySeed()).slice(0, Math.max(remain, 0));
}
function reviewQueue(state) {
  const due = dueWords(state);
  const map = {};
  WORDS.forEach(function (o) { map[o.w] = o; });
  return due.map(function (w) { return map[w]; }).filter(Boolean);
}
function reviewWord(state, w, result) {
  const prev = state.words[w] || { b: 0, due: 0, r: 0, e: 0, at: 0 };
  let box = prev.b || 0;
  let due = Date.now();
  if (result === 'know') {
    box = clamp(box + 1, 1, 6);
    due = Date.now() + BOX_DAYS[box] * DAY;
  } else if (result === 'fuzzy') {
    box = clamp(box, 1, 2);
    due = Date.now() + DAY;
  } else {
    box = 1;
    due = Date.now() + 0.5 * DAY;
  }
  const card = {
    b: box, due: due, at: Date.now(),
    r: (prev.r || 0) + (result === 'know' ? 1 : 0),
    e: (prev.e || 0) + (result === 'forget' ? 1 : 0),
  };
  return Object.assign({}, state.words, { [w]: card });
}

/* ---------- 发音 ---------- */
let voiceCache = [];
function loadVoices() {
  try {
    const vs = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
    if (vs && vs.length) voiceCache = vs;
  } catch (err) { /* ignore */ }
  return voiceCache;
}
function pickVoice(lang) {
  const vs = voiceCache.length ? voiceCache : loadVoices();
  if (!vs.length) return null;
  const exact = vs.filter(function (v) { return v.lang && v.lang.replace('_', '-') === lang; });
  if (exact.length) return exact[0];
  const prefix = vs.filter(function (v) { return v.lang && v.lang.indexOf('en') === 0; });
  return prefix[0] || null;
}
function speak(text, rate, lang) {
  try {
    if (!window.speechSynthesis) return false;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(String(text || ''));
    u.lang = lang || 'en-US';
    u.rate = rate || 0.9;
    const v = pickVoice(u.lang);
    if (v) u.voice = v;
    window.speechSynthesis.speak(u);
    return true;
  } catch (err) { return false; }
}
function stopSpeak() {
  try { window.speechSynthesis.cancel(); } catch (err) { /* ignore */ }
}

/* ---------- 录音 ---------- */
function useRecorder() {
  const [state, setState] = React.useState({ recording: false, url: '', error: '' });
  const recRef = React.useRef(null);
  const streamRef = React.useRef(null);
  const chunksRef = React.useRef([]);

  function cleanupStream() {
    try {
      if (streamRef.current) {
        streamRef.current.getTracks().forEach(function (t) { t.stop(); });
      }
    } catch (err) { /* ignore */ }
    streamRef.current = null;
  }

  React.useEffect(function () {
    return function () {
      cleanupStream();
      if (state.url) { try { URL.revokeObjectURL(state.url); } catch (err) { /* ignore */ } }
    };
  }, []);

  function start() {
    setState({ recording: true, url: '', error: '' });
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setState({ recording: false, url: '', error: '当前浏览器不支持录音，请用 Chrome 或 Edge。' });
      return;
    }
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
      streamRef.current = stream;
      const MR = window.MediaRecorder;
      if (!MR) {
        cleanupStream();
        setState({ recording: false, url: '', error: '当前浏览器不支持录音。' });
        return;
      }
      const rec = new MR(stream);
      recRef.current = rec;
      chunksRef.current = [];
      rec.ondataavailable = function (e) { if (e.data && e.data.size) chunksRef.current.push(e.data); };
      rec.onstop = function () {
        const blob = new Blob(chunksRef.current, { type: rec.mimeType || 'audio/webm' });
        const url = URL.createObjectURL(blob);
        setState({ recording: false, url: url, error: '' });
        cleanupStream();
      };
      rec.start();
    }).catch(function (err) {
      setState({
        recording: false, url: '',
        error: '无法使用麦克风：' + (err && err.name ? err.name : '被拒绝') + '。请允许麦克风权限后重试。',
      });
    });
  }

  function stop() {
    try { if (recRef.current && recRef.current.state !== 'inactive') recRef.current.stop(); } catch (err) { /* ignore */ }
  }

  function clear() {
    setState(function (prev) {
      if (prev.url) { try { URL.revokeObjectURL(prev.url); } catch (err) { /* ignore */ } }
      return { recording: false, url: '', error: '' };
    });
  }

  return { state: state, start: start, stop: stop, clear: clear };
}

/* ---------- 定位小测 ---------- */
const PLACEMENT = (function () {
  const items = [];
  const pick = shuffled(GRAMMAR.slice(), 20261017).slice(0, 6);
  pick.forEach(function (g, i) {
    const q = g.quiz[i % g.quiz.length];
    items.push({ q: q.q, options: q.options, answer: q.answer, explain: q.explain, from: g.title });
  });
  const words = shuffled(WORDS.slice(0, 1200), 20261018).slice(0, 4);
  words.forEach(function (o) {
    const right = o.m.split('；')[0].slice(0, 26);
    const wrongs = shuffled(WORDS.slice(0, 1200), o.w.length * 31 + 7)
      .filter(function (x) { return x.w !== o.w && x.m.split('；')[0].slice(0, 26) !== right; })
      .slice(0, 3)
      .map(function (x) { return x.m.split('；')[0].slice(0, 26); });
    const options = [right].concat(wrongs);
    const order = shuffled([0, 1, 2, 3], o.w.length + 3);
    items.push({
      q: '“' + o.w + '” 最接近的意思是：',
      options: order.map(function (k) { return options[k]; }),
      answer: order.indexOf(0),
      explain: o.w + '：' + o.m,
      from: '词汇',
    });
  });
  return items;
})();

function Placement(props) {
  const t = props.t;
  const onDone = props.onDone;
  const idxState = useState(0);
  const idx = idxState[0];
  const setIdx = idxState[1];
  const scoreState = useState(0);
  const score = scoreState[0];
  const setScore = scoreState[1];
  const pickState = useState(null);
  const pick = pickState[0];
  const setPick = pickState[1];
  const doneState = useState(false);
  const done = doneState[0];
  const setDone = doneState[1];

  if (done) {
    const level = score >= 8 ? '较好' : score >= 5 ? '中等' : '基础';
    const daily = score >= 8 ? 30 : score >= 5 ? 20 : 12;
    return h(Card, null,
      h('h3', null, '定位结果：' + level),
      h('div', { className: 'eng-row' },
        h('div', { className: 'grow' },
          h('div', null, '答对 ' + score + ' / ' + PLACEMENT.length + ' 题'),
          h('div', { className: 'eng-small eng-muted' }, '建议每天新词 ' + daily + ' 个，先把基础语法过一遍。')),
      ),
      h('div', { className: 'eng-actions' },
        h(Btn, {
          tone: 'primary',
          onClick: function () { onDone({ score: score, level: level, daily: daily, at: Date.now() }); },
        }, '按这个计划开始')));
  }

  const item = PLACEMENT[idx];
  function choose(i) {
    if (pick !== null) return;
    setPick(i);
    if (i === item.answer) setScore(score + 1);
  }
  function next() {
    if (idx + 1 >= PLACEMENT.length) { setDone(true); return; }
    setIdx(idx + 1);
    setPick(null);
  }

  return h(Card, null,
    h('h3', null, '5 分钟定位小测', h('span', { className: 'n' }, (idx + 1) + ' / ' + PLACEMENT.length)),
    h('div', { className: 'eng-small eng-muted', style: { marginBottom: '8px' } }, '来自「' + item.from + '」· 不用查资料，凭感觉选。'),
    h('div', { style: { fontSize: '14px', lineHeight: 1.7 } }, item.q),
    h('div', { style: { marginTop: '10px' } },
      item.options.map(function (opt, i) {
        let tone = '';
        if (pick !== null) {
          if (i === item.answer) tone = ' ok';
          else if (i === pick) tone = ' hot';
        }
        return h('button', {
          key: i,
          type: 'button',
          className: 'eng-btn ghost eng-choice' + tone,
          onClick: function () { choose(i); },
        }, String.fromCharCode(65 + i) + '. ' + opt);
      })),
    pick !== null ? h('div', { className: 'eng-explain' }, item.explain) : null,
    pick !== null ? h('div', { className: 'eng-actions' },
      h(Btn, { tone: 'primary', onClick: next }, idx + 1 >= PLACEMENT.length ? '看结果' : '下一题')) : null);
}

/* ---------- 今日 ---------- */
function Today(props) {
  const t = props.t;
  const state = props.state;
  const update = props.update;
  const goTab = props.goTab;
  const reset = props.reset;

  const today = dayOf(state, dayKey());
  const learnt = learntCount(state);
  const total = WORDS.length;
  const due = dueWords(state).length;
  const streak = streakOf(state);
  const days = daysUntil(state.examDate);
  const dailyNew = state.settings.dailyNew || 20;
  const week = (function () {
    let minutes = 0, words = 0;
    for (let i = 0; i < 7; i += 1) {
      const d = new Date();
      d.setDate(d.getDate() - i);
      const rec = state.daily[dayKey(d)];
      if (rec) { minutes += rec.minutes || 0; words += (rec.newWords || 0) + (rec.reviews || 0); }
    }
    return { minutes: minutes, words: words };
  })();

  const plans = [
    { done: today.newWords >= dailyNew, label: '新词 ' + dailyNew + ' 个', count: today.newWords + '/' + dailyNew, tab: 'words' },
    { done: due === 0 || today.reviews >= Math.min(due, 20), label: '复习到期词', count: today.reviews + '/' + Math.max(Math.min(due, 20), 0), tab: 'words' },
    { done: today.grammar >= 1, label: '语法 1 个考点', count: today.grammar + '/1', tab: 'grammar' },
    { done: today.speaking >= 10, label: '口语 10 句', count: today.speaking + '/10', tab: 'speaking' },
  ];

  return h('div', null,
    h('div', { className: 'eng-grid' },
      h(Card, { className: 'eng-stat' },
        h('div', { className: 'k' }, '距考试'),
        h('div', { className: 'v' }, days === null ? '—' : String(Math.max(days, 0)), h('span', { className: 'u' }, '天'))),
      h(Card, { className: 'eng-stat' },
        h('div', { className: 'k' }, '已学词汇'),
        h('div', { className: 'v' }, String(learnt), h('span', { className: 'u' }, '/ ' + total)),
        h(Bar, { value: total ? learnt / total * 100 : 0 })),
      h(Card, { className: 'eng-stat' },
        h('div', { className: 'k' }, '今日待复习'),
        h('div', { className: 'v' }, String(due), h('span', { className: 'u' }, '词')),
        h('div', { className: 'eng-small eng-muted' }, '正确率 ' + (function () {
          let r = 0, w = 0;
          Object.keys(state.grammar).forEach(function (k) { r += state.grammar[k].r || 0; w += state.grammar[k].w || 0; });
          return (r + w) ? Math.round(r / (r + w) * 100) + '%' : '—';
        })())),
      h(Card, { className: 'eng-stat' },
        h('div', { className: 'k' }, '连续打卡'),
        h('div', { className: 'v' }, String(streak), h('span', { className: 'u' }, '天')))),

    state.placement
      ? null
      : h('div', { style: { marginTop: '12px' } },
        h(Placement, {
          t: t,
          onDone: function (result) {
            update(function (prev) {
              return Object.assign({}, prev, {
                placement: result,
                settings: Object.assign({}, prev.settings, { dailyNew: result.daily }),
              });
            });
          },
        })),

    h('div', { className: 'eng-cols' },
      h(Card, null,
        h('h3', null, '今日任务', h('span', { className: 'n' }, dayKey())),
        plans.map(function (p) {
          return h('div', { className: 'eng-row eng-goal', key: p.label },
            h('span', { className: 'eng-check', 'data-done': p.done ? 'true' : 'false' }, '✓'),
            h('span', { style: { color: p.done ? 'var(--dsw-alias-label-secondary)' : 'inherit' } }, p.label),
            h('span', { className: 'eng-muted eng-small', style: { marginLeft: 'auto' } }, p.count));
        }),
        h('div', { className: 'eng-actions' },
          h(Btn, { tone: 'primary', onClick: function () { goTab('words'); } }, '开始背词'),
          h(Btn, { onClick: function () { goTab('speaking'); } }, '练口语'),
          h(Btn, { onClick: function () { goTab('grammar'); } }, '学语法'))),

      h(Card, null,
        h('h3', null, '进度',
          h('span', { className: 'n' }, '目标 ' + state.target + ' 分')),
        h('div', { className: 'eng-row' },
          h('div', { className: 'grow' },
            h('div', null, '词汇覆盖'),
            h(Bar, { value: total ? learnt / total * 100 : 0 })),
          h('span', { className: 'eng-small eng-muted' }, Math.round(total ? learnt / total * 100 : 0) + '%')),
        h('div', { className: 'eng-row' },
          h('div', { className: 'grow' },
            h('div', null, '本周学习'),
            h('div', { className: 'eng-small eng-muted' }, fmtMinutes(week.minutes) + ' · 过词 ' + week.words + ' 个')),
          h('span', { className: 'eng-small eng-muted' }, '今天 ' + fmtMinutes(today.minutes))),
        h('div', { className: 'eng-row' },
          h('div', { className: 'grow' },
            h('div', null, '语法考点'),
            h('div', { className: 'eng-small eng-muted' }, (function () {
              let done = 0;
              GRAMMAR.forEach(function (g) { if (state.grammar[g.id] && state.grammar[g.id].r > 0) done += 1; });
              return done + ' / ' + GRAMMAR.length + ' 个已练';
            })())),
          h('span', { className: 'eng-small eng-muted' }, '套卷 ' + ((state.papers || []).length) + ' 次'))),

      h(Card, null,
        h('h3', null, '设置'),
        h('div', { className: 'eng-toolbar' },
          h('span', { className: 'eng-small eng-muted' }, '考试日期'),
          h('input', {
            className: 'eng-input', type: 'date', value: state.examDate,
            onChange: function (e) {
              update(function (prev) { return Object.assign({}, prev, { examDate: e.target.value }); });
            },
          })),
        h('div', { className: 'eng-toolbar' },
          h('span', { className: 'eng-small eng-muted' }, '目标分'),
          h('input', {
            className: 'eng-input', type: 'number', min: 60, max: 150, value: state.target,
            style: { width: '76px' },
            onChange: function (e) {
              const v = clamp(Number(e.target.value) || 140, 60, 150);
              update(function (prev) { return Object.assign({}, prev, { target: v }); });
            },
          })),
        h('div', { className: 'eng-toolbar' },
          h('span', { className: 'eng-small eng-muted' }, '每日新词'),
          [12, 20, 30, 40].map(function (n) {
            return h(Btn, {
              key: n, on: dailyNew === n,
              onClick: function () {
                update(function (prev) {
                  return Object.assign({}, prev, { settings: Object.assign({}, prev.settings, { dailyNew: n }) });
                });
              },
            }, String(n));
          })),
        h('div', { className: 'eng-small eng-muted' }, '按 176 天、每天 20 个新词计算，刚好覆盖整本词表。'),
        h('div', { className: 'eng-actions' },
          h(Btn, { tone: 'ghost', onClick: reset }, '清空学习记录'))),

      h(Card, null,
        h('h3', null, '快捷入口'),
        h('div', { className: 'eng-actions' },
          h(Btn, { onClick: function () { goTab('speaking'); } }, '口语跟读'),
          h(Btn, { onClick: function () { goTab('papers'); } }, '套卷计时'),
          h(Btn, { onClick: function () { goTab('writing'); } }, '作文批改'),
          h(Btn, { onClick: function () { goTab('wrong'); } }, '错题本')))),

    state.placement
      ? h('div', { className: 'eng-small eng-muted', style: { marginTop: '10px' } },
        '定位结果：' + state.placement.level + '（' + state.placement.score + '/10）· 数据只保存在这台设备的浏览器里。')
      : null);
}

function Words(props) {
  const t = props.t;
  const state = props.state;
  const answerWord = props.answerWord;

  const sessionState = useState(null);
  const session = sessionState[0];
  const setSession = sessionState[1];
  const revealState = useState(false);
  const revealed = revealState[0];
  const setRevealed = revealState[1];

  const queryState = useState('');
  const query = queryState[0];
  const setQuery = queryState[1];
  const filterState = useState('all');
  const filter = filterState[0];
  const setFilter = filterState[1];
  const limitState = useState(60);
  const limit = limitState[0];
  const setLimit = limitState[1];

  const today = dayOf(state, dayKey());
  const due = reviewQueue(state);
  const learnt = learntCount(state);
  const target = state.settings.dailyNew || 20;

  function startSession() {
    const fresh = todayNewQueue(state);
    const queue = due.concat(fresh).slice(0, 80).map(function (o) {
      return { w: o.w, m: o.m, isNew: !state.words[o.w] };
    });
    if (!queue.length) {
      setSession({ queue: [], i: 0, done: 0 });
      return;
    }
    setSession({ queue: queue, i: 0, done: 0 });
    setRevealed(false);
  }

  function answer(result) {
    const item = session.queue[session.i];
    answerWord(item.w, result, item.isNew);
    const next = session.i + 1;
    setRevealed(false);
    if (next >= session.queue.length) {
      setSession({ queue: session.queue, i: next, done: session.done + 1, finished: true });
    } else {
      setSession({ queue: session.queue, i: next, done: session.done + 1 });
    }
  }

  if (session) {
    if (session.finished || session.i >= session.queue.length) {
      return h('div', null,
        h(Card, null,
          h('h3', null, '这一轮完成了'),
          h('div', { className: 'eng-muted', style: { marginBottom: '12px' } },
            '本轮复习 ' + session.done + ' 个词。明天来会按遗忘曲线再安排。'),
          h('div', { className: 'eng-actions' },
            h(Btn, { tone: 'primary', onClick: function () { setSession(null); } }, '回到词表'),
            h(Btn, { onClick: startSession }, '再来一轮'))),
        h('div', { className: 'eng-small eng-muted' },
          '今天：新词 ' + today.newWords + ' / ' + target + '，复习 ' + today.reviews + ' 词。'));
    }

    const item = session.queue[session.i];
    return h('div', null,
      h('div', { className: 'eng-toolbar' },
        h(Btn, { tone: 'ghost', onClick: function () { setSession(null); } }, '退出'),
        h('span', { className: 'eng-small eng-muted' }, (session.i + 1) + ' / ' + session.queue.length),
        h('span', { className: 'eng-spacer' }),
        h('span', { className: 'eng-small eng-muted' }, item.isNew ? '新词' : '复习')),
      h(Card, { className: 'eng-flash' },
        h('div', { className: 'eng-word' }, item.w),
        h(Btn, { tone: 'ghost', onClick: function () { speak(item.w, state.settings.rate); } }, '🔊 听发音'),
        revealed
          ? h('div', { className: 'eng-mean' }, item.m)
          : h(Btn, { onClick: function () { setRevealed(true); } }, '显示释义')),
      revealed
        ? h('div', { className: 'eng-actions', style: { justifyContent: 'center' } },
          h(Btn, { onClick: function () { answer('forget'); } }, '不认识'),
          h(Btn, { onClick: function () { answer('fuzzy'); } }, '模糊'),
          h(Btn, { tone: 'primary', onClick: function () { answer('know'); } }, '认识'))
        : h('div', { className: 'eng-small eng-muted', style: { textAlign: 'center' } }, '先在心里回忆，再看释义。'));
  }

  const q = query.trim().toLowerCase();
  const filtered = WORDS.filter(function (o) {
    if (q && o.w.toLowerCase().indexOf(q) < 0 && o.m.indexOf(q) < 0) return false;
    const c = state.words[o.w];
    if (filter === 'new' && c) return false;
    if (filter === 'learning' && (!c || c.b >= 4)) return false;
    if (filter === 'done' && (!c || c.b < 4)) return false;
    if (filter === 'wrong' && (!c || !c.e)) return false;
    return true;
  });

  return h('div', null,
    h('div', { className: 'eng-grid' },
      h(Card, { className: 'eng-stat' },
        h('div', { className: 'k' }, '今日新词'),
        h('div', { className: 'v' }, String(today.newWords), h('span', { className: 'u' }, '/ ' + target)),
        h(Bar, { value: target ? today.newWords / target * 100 : 0 })),
      h(Card, { className: 'eng-stat' },
        h('div', { className: 'k' }, '今日复习'),
        h('div', { className: 'v' }, String(today.reviews), h('span', { className: 'u' }, '词'))),
      h(Card, { className: 'eng-stat' },
        h('div', { className: 'k' }, '到期待复习'),
        h('div', { className: 'v' }, String(due.length), h('span', { className: 'u' }, '词'))),
      h(Card, { className: 'eng-stat' },
        h('div', { className: 'k' }, '词表总量'),
        h('div', { className: 'v' }, String(learnt), h('span', { className: 'u' }, '/ ' + WORDS.length)))),

    h('div', { className: 'eng-card' },
      h('h3', null, '开始学习',
        h('span', { className: 'n' }, '到期 ' + due.length + ' · 新词 ' + todayNewQueue(state).length)),
      h('div', { className: 'eng-muted', style: { marginBottom: '10px' } },
        '每轮最多 80 个词：先复习到期词，再学新词。认识的词会按 1、2、4、7、15、30 天的间隔再出现。'),
      h('div', { className: 'eng-actions', style: { marginTop: 0 } },
        h(Btn, { tone: 'primary', onClick: startSession }, due.length ? '复习 + 学新词' : '开始背新词')),
      h('div', { className: 'eng-small eng-muted', style: { marginTop: '8px' } },
        '词表来源：高考英语大纲 3500 词（与陕西专升本词汇要求高度重叠），去重后共 ' + WORDS.length + ' 条；发音由浏览器朗读，不依赖网络。')),

    h('div', { className: 'eng-toolbar' },
      h('input', {
        className: 'eng-input', placeholder: '搜索单词或中文释义…', value: query,
        style: { flex: '1 1 220px' },
        onChange: function (e) { setQuery(e.target.value); setLimit(60); },
      }),
      ['all', 'new', 'learning', 'done', 'wrong'].map(function (k) {
        const label = { all: '全部', new: '未学', learning: '学习中', done: '已掌握', wrong: '错词' }[k];
        return h(Btn, { key: k, on: filter === k, onClick: function () { setFilter(k); setLimit(60); } }, label);
      })),
    h('div', { className: 'eng-small eng-muted', style: { marginBottom: '8px' } }, '共 ' + filtered.length + ' 个词'),

    filtered.length
      ? h(Card, null, filtered.slice(0, limit).map(function (o) {
        return h(WordRow, { key: o.w, item: o, state: state });
      }))
      : h(Empty, null, '没有匹配的词。'),
    filtered.length > limit
      ? h('div', { style: { textAlign: 'center', marginTop: '10px' } },
        h(Btn, { onClick: function () { setLimit(limit + 120); } }, '显示更多（还有 ' + (filtered.length - limit) + ' 个）'))
      : null);
}

/* ===== app-grammar.js ===== */
/* ---------- 语法 ---------- */
function GrammarQuiz(props) {
  const item = props.item;
  const state = props.state;
  const onAnswer = props.onAnswer;
  const key = item.id;
  const answersState = useState({});
  const answers = answersState[0];
  const setAnswers = answersState[1];
  const rec = state.grammar[key] || { r: 0, w: 0 };
  const chosen = answers[key];

  return h(Card, null,
    h('div', { style: { display: 'flex', alignItems: 'center', gap: '8px', marginBottom: '6px' } },
      h('h3', { style: { margin: 0 } }, item.title),
      h(Pill, null, item.tag),
      h('span', { className: 'eng-small eng-muted', style: { marginLeft: 'auto' } },
        '练对 ' + (rec.r || 0) + ' · 练错 ' + (rec.w || 0))),
    h('div', { className: 'eng-small eng-muted', style: { marginBottom: '10px' } }, item.en),

    item.intro.map(function (p, i) { return h('p', { key: i, style: { margin: '0 0 8px' } }, p); }),

    h('div', { className: 'eng-sec' }, '例句'),
    item.examples.map(function (ex, i) {
      return h('div', { key: i, className: 'eng-quote' },
        h('div', { className: 'eng-en' }, ex.en),
        h('div', { className: 'eng-small eng-muted' }, ex.cn));
    }),

    h('div', { className: 'eng-sec' }, '易错点'),
    h('ul', { style: { margin: '0 0 4px', paddingLeft: '18px' } },
      item.tips.map(function (tip, i) { return h('li', { key: i, style: { marginBottom: '4px' } }, tip); })),

    h('div', { className: 'eng-sec' }, '练一练'),
    item.quiz.map(function (q, qi) {
      const pickKey = qi;
      const pick = chosen ? chosen[pickKey] : undefined;
      return h('div', { key: qi, style: { padding: '10px 0', borderTop: qi ? '1px solid var(--dsw-alias-border-l1)' : '0' } },
        h('div', { style: { marginBottom: '6px' } }, (qi + 1) + '. ' + q.q),
        q.options.map(function (opt, oi) {
          let tone = '';
          if (pick !== undefined) {
            if (oi === q.answer) tone = ' ok';
            else if (oi === pick) tone = ' hot';
          }
          return h('button', {
            key: oi, type: 'button', className: 'eng-btn ghost eng-choice' + tone,
            onClick: function () {
              if (pick !== undefined) return;
              const next = Object.assign({}, answers[key] || {});
              next[pickKey] = oi;
              setAnswers(Object.assign({}, answers, { [key]: next }));
              onAnswer(item.id, oi === q.answer);
            },
          }, String.fromCharCode(65 + oi) + '. ' + opt);
        }),
        pick !== undefined
          ? h('div', { className: 'eng-explain' }, (pick === q.answer ? '✓ 正确。' : '✗ 正确答案是 ' + String.fromCharCode(65 + q.answer) + '。') + q.explain)
          : null);
    }));
}

function Grammar(props) {
  const t = props.t;
  const state = props.state;
  const record = props.recordGrammar;
  const open = props.open;
  const setOpen = props.setOpen;
  const filterState = useState('all');
  const filter = filterState[0];
  const setFilter = filterState[1];

  if (open) {
    const item = GRAMMAR.filter(function (g) { return g.id === open; })[0];
    if (!item) return null;
    return h('div', null,
      h('div', { className: 'eng-toolbar' },
        h(Btn, { tone: 'ghost', onClick: function () { setOpen(null); } }, '← 返回考点列表'),
        h('span', { className: 'eng-small eng-muted' }, '看完讲解再做练习，做完会自动记录。')),
      h(GrammarQuiz, { item: item, state: state, onAnswer: record }));
  }

  const list = GRAMMAR.filter(function (g) {
    const rec = state.grammar[g.id];
    if (filter === 'todo' && rec && (rec.r || rec.w)) return false;
    if (filter === 'weak' && (!rec || (rec.w || 0) <= (rec.r || 0))) return false;
    return true;
  });
  let doneCount = 0;
  GRAMMAR.forEach(function (g) { if (state.grammar[g.id] && (state.grammar[g.id].r || state.grammar[g.id].w)) doneCount += 1; });

  return h('div', null,
    h('div', { className: 'eng-toolbar' },
      h('span', { className: 'eng-small eng-muted' }, '已练 ' + doneCount + ' / ' + GRAMMAR.length),
      h('span', { className: 'eng-spacer' }),
      ['all', 'todo', 'weak'].map(function (k) {
        return h(Btn, { key: k, on: filter === k, onClick: function () { setFilter(k); } },
          { all: '全部', todo: '未练', weak: '错得多' }[k]);
      })),
    list.length
      ? h('div', { className: 'eng-grid' }, list.map(function (g) {
        const rec = state.grammar[g.id] || { r: 0, w: 0 };
        const total = (rec.r || 0) + (rec.w || 0);
        return h('button', {
          key: g.id, type: 'button', className: 'eng-card',
          style: { textAlign: 'left', cursor: 'pointer', font: 'inherit', color: 'inherit', marginBottom: 0 },
          onClick: function () { setOpen(g.id); },
        },
          h('div', { style: { display: 'flex', alignItems: 'center', gap: '8px', marginBottom: '4px' } },
            h('span', { style: { fontWeight: 600 } }, g.title),
            h(Pill, null, g.tag),
            total ? h(Pill, { tone: rec.w > rec.r ? 'hot' : 'ok' }, rec.r + '/' + total) : null),
          h('div', { className: 'eng-small eng-muted' }, g.en + ' · ' + g.quiz.length + ' 题'));
      }))
      : h(Empty, null, '这里还没有考点。'));
}

function Speaking(props) {

  const setMode = modeState[1];

  const groupId = groupState[0];
  const setGroupId = groupState[1];
  const dialogState = useState(SPEAK_DIALOGS[0].id);
  const dialogId = dialogState[0];

  const passageState = useState(SPEAK_PASSAGES[0].id);
  const passageId = passageState[0];

  const today = dayOf(state, dayKey());
  const scored = Object.keys(state.speaking).length;
  let sum = 0;
  Object.keys(state.speaking).forEach(function (k) { sum += state.speaking[k].score || 0; });

        h('div', { className: 'eng-toolbar' },
          SPEAK_GROUPS.map(function (g) {
            return h(Btn, { key: g.id, on: groupId === g.id, onClick: function () { setGroupId(g.id); } }, g.title);

function Papers(props) {
  const t = props.t;
  const state = props.state;
  const recordPaper = props.recordPaper;
  const goWriting = props.goWriting;

  const totalSec = PAPER.minutes * 60;
  const leftState = useState(totalSec);
  const left = leftState[0];
  const setLeft = leftState[1];
  const runState = useState(false);
  const running = runState[0];
  const setRunning = runState[1];
  const ansState = useState({});
  const answers = ansState[0];
  const setAnswers = ansState[1];
  const scoreState = useState('');
  const score = scoreState[0];
  const setScore = scoreState[1];

  useEffect(function () {
    if (!running) return undefined;
    const id = window.setInterval(function () {
      setLeft(function (v) { return Math.max(0, v - 1); });
    }, 1000);
    return function () { window.clearInterval(id); };
  }, [running]);

  useEffect(function () {
    if (left === 0 && running) setRunning(false);
  }, [left, running]);

  function pick(sectionId, qi, oi) {
    const next = Object.assign({}, answers);
    const sec = Object.assign({}, next[sectionId] || {});
    sec[qi] = oi;
    next[sectionId] = sec;
    setAnswers(next);
  }

  function objectiveStats() {
    let right = 0, total = 0;
    PAPER.sections.forEach(function (sec) {
      if (sec.kind === 'translation' || sec.kind === 'writing') return;
      (sec.items || sec.questions || []).forEach(function (q, qi) {
        total += 1;
        const picked = answers[sec.id] ? answers[sec.id][qi] : undefined;
        if (picked === q.answer) right += 1;
      });
    });
    return { right: right, total: total };
  }

  const stats = objectiveStats();
  const mm = Math.floor(left / 60);
  const ss = left % 60;
  const timeUsed = Math.round((totalSec - left) / 60);

  return h('div', null,
    h(Card, null,
      h('div', { style: { display: 'flex', alignItems: 'center', gap: '16px', flexWrap: 'wrap' } },
        h('div', { className: 'eng-timer' + (left < 300 ? ' warn' : '') }, pad2(mm) + ':' + pad2(ss)),
        h('div', { className: 'grow' },
          h('div', { style: { fontWeight: 600 } }, PAPER.title),
          h('div', { className: 'eng-small eng-muted' }, PAPER.note)),
        h('button', {
          type: 'button', className: 'eng-btn primary',
          onClick: function () { setRunning(!running); },
        }, running ? '暂停' : (left === totalSec ? '开始计时' : '继续')),
        h('button', {
          type: 'button', className: 'eng-btn ghost',
          onClick: function () { setRunning(false); setLeft(totalSec); },
        }, '重置')),
      h(Bar, { value: (1 - left / totalSec) * 100 })),

    h('div', { className: 'eng-small eng-muted', style: { marginBottom: '10px' } },
      '客观题已答对 ' + stats.right + ' / ' + stats.total + '。做完后自己估一个总分记下来。'),

    PAPER.sections.map(function (sec) {
      return h(PaperSection, {
        key: sec.id, section: sec, answers: answers, onPick: pick,
        goWriting: goWriting,
      });
    }),

    h(Card, null,
      h('h3', null, '记录这次成绩'),
      h('div', { className: 'eng-toolbar' },
        h('span', { className: 'eng-small eng-muted' }, '总分（满分 150）'),
        h('input', {
          className: 'eng-input', type: 'number', min: 0, max: 150, value: score,
          style: { width: '86px' }, placeholder: '例如 96',
          onChange: function (e) { setScore(e.target.value); },
        }),
        h('span', { className: 'eng-small eng-muted' }, '用时 ' + timeUsed + ' 分钟'),
        h('span', { className: 'eng-spacer' }),
        h(Btn, {
          tone: 'primary',
          onClick: function () {
            const n = clamp(Number(score) || 0, 0, 150);
            recordPaper({ id: PAPER.id, score: n, minutes: timeUsed, at: Date.now() });
            setScore('');
            setRunning(false);
            setLeft(totalSec);
            setAnswers({});
          },
        }, '保存成绩')),
      (state.papers || []).length
        ? h('div', { style: { marginTop: '6px' } },
          h('div', { className: 'eng-sec', style: { marginTop: '8px' } }, '历史成绩'),
          (state.papers || []).slice().reverse().map(function (rec, i) {
            return h('div', { className: 'eng-row', key: i },
              h('div', { className: 'grow' }, new Date(rec.at || 0).toLocaleDateString() + ' · ' + rec.id),
              h('span', { className: 'eng-small eng-muted' }, fmtMinutes((rec.minutes || 0) * 60)),
              h(Pill, { tone: rec.score >= 120 ? 'ok' : rec.score >= 90 ? 'warn' : 'hot' }, rec.score + ' 分'));
          }))
        : null));
}

function copyText(text) {
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text);
      return true;
    }
  } catch (err) { /* fallthrough */ }
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    return true;
  } catch (err) { return false; }
}

function wordCount(text) {
  return String(text || '').trim().split(/\s+/).filter(Boolean).length;
}

        }),

/* ---------- 错题本 ---------- */
function Mistakes(props) {
  const t = props.t;
  const state = props.state;
  const goTab = props.goTab;
  const setGrammarOpen = props.setGrammarOpen;

  const wordMap = {};
  WORDS.forEach(function (o) { wordMap[o.w] = o; });
  const badWords = Object.keys(state.words)
    .filter(function (w) { return state.words[w].e > 0; })
    .map(function (w) { return { w: w, c: state.words[w], o: wordMap[w] }; })
    .filter(function (x) { return x.o; })
    .sort(function (a, b) { return b.c.e - a.c.e; })
    .slice(0, 80);

  const badGrammar = GRAMMAR.filter(function (g) {
    const rec = state.grammar[g.id];
    return rec && (rec.w || 0) > 0;
  }).sort(function (a, b) {
    const ra = state.grammar[a.id], rb = state.grammar[b.id];
    return (rb.w || 0) - (ra.w || 0);
  });

  const lowSpeaking = Object.keys(state.speaking)
    .filter(function (k) { return (state.speaking[k].score || 0) <= 2; })
    .map(function (k) { return { id: k, rec: state.speaking[k] }; });

  function labelOfSpeak(id) {
    for (let i = 0; i < SPEAK_GROUPS.length; i += 1) {
      for (let j = 0; j < SPEAK_GROUPS[i].items.length; j += 1) {
        if (SPEAK_GROUPS[i].id + '-' + j === id) return SPEAK_GROUPS[i].items[j].en;
      }
    }
    for (let i = 0; i < SPEAK_DIALOGS.length; i += 1) {
      for (let j = 0; j < SPEAK_DIALOGS[i].lines.length; j += 1) {
        if (SPEAK_DIALOGS[i].id + '-' + j === id) return SPEAK_DIALOGS[i].lines[j].en;
      }
    }
    for (let i = 0; i < SPEAK_PASSAGES.length; i += 1) {
      if (SPEAK_PASSAGES[i].id === id) return SPEAK_PASSAGES[i].title;
    }
    return id;
  }

  return h('div', null,
    h('div', { className: 'eng-sec' }, '词汇错词', h('span', { className: 'n' }, badWords.length + ' 个')),
    badWords.length
      ? h(Card, null, badWords.map(function (x) {
        return h('div', { className: 'eng-row', key: x.w },
          h('div', { className: 'grow' },
            h('div', { style: { display: 'flex', gap: '8px', alignItems: 'center' } },
              h('span', { style: { fontWeight: 600 } }, x.w),
              h(Pill, { tone: 'hot' }, '错 ' + x.c.e + ' 次'),
              h(Pill, null, '第 ' + (x.c.b || 0) + ' 阶')),
            h('div', { className: 'eng-small eng-muted' }, x.o.m)),
          h(Btn, { tone: 'ghost', onClick: function () { speak(x.w); } }, '🔊'));
      }))
      : h(Empty, null, '还没有错词。背词时点「不认识」的词会自动进来。'),

    h('div', { className: 'eng-sec' }, '语法薄弱点', h('span', { className: 'n' }, badGrammar.length + ' 个')),
    badGrammar.length
      ? h('div', { className: 'eng-grid' }, badGrammar.map(function (g) {
        const rec = state.grammar[g.id];
        return h('button', {
          key: g.id, type: 'button', className: 'eng-card',
          style: { textAlign: 'left', cursor: 'pointer', font: 'inherit', color: 'inherit', marginBottom: 0 },
          onClick: function () { goTab('grammar'); setGrammarOpen(g.id); },
        },
          h('div', { style: { fontWeight: 600, marginBottom: '4px' } }, g.title),
          h('div', { className: 'eng-small eng-muted' }, '对 ' + (rec.r || 0) + ' · 错 ' + (rec.w || 0) + ' · 点开重练'));
      }))
      : h(Empty, null, '还没有语法错题。'),

    h('div', { className: 'eng-sec' }, '口语低分句', h('span', { className: 'n' }, lowSpeaking.length + ' 句')),
    lowSpeaking.length
      ? h(Card, null, lowSpeaking.map(function (x) {
        return h('div', { className: 'eng-row', key: x.id },
          h('div', { className: 'grow' }, h('div', { className: 'eng-en eng-clip' }, labelOfSpeak(x.id))),
          h(Pill, { tone: 'hot' }, x.rec.score + ' 分'),
          h(Btn, { tone: 'ghost', onClick: function () { goTab('speaking'); } }, '再练'));
      }))
      : h(Empty, null, '还没有低分记录。'),
    h('div', { className: 'eng-small eng-muted', style: { marginTop: '14px' } },
      '错词按遗忘曲线会自动回到复习队列；语法薄弱点建议当天重做一遍。'));
}

    h('button', {
      type: 'button', onClick: open, title: t('open'),
      style: {
        display: 'inline-flex', alignItems: 'center', gap: '7px',
        padding: '4px 12px', borderRadius: '999px', cursor: 'pointer',
        border: '1px solid var(--dsw-alias-border-l1)',
        background: 'var(--dsw-alias-bg-layer-1)',
        color: 'var(--dsw-alias-label-secondary)',
        font: 'inherit', fontSize: '12px', whiteSpace: 'nowrap', flex: '0 0 auto', width: 'auto', maxWidth: 'none',
      },
    },
      h('span', { style: { fontSize: '13px', lineHeight: 1, color: 'var(--dsw-alias-brand-primary)' } }, 'EN'),
      h('span', { style: { whiteSpace: 'nowrap' } }, t('title'))));
}

function CoachPage(props) {
  const t = props.t;
  const ctx = props.ctx;
  const storeState = useState(loadState);
  const state = storeState[0];
  const setState = storeState[1];
  const tabState = useState('today');
  const tab = tabState[0];
  const setTab = tabState[1];
  const grammarOpenState = useState(null);
  const grammarOpen = grammarOpenState[0];
  const setGrammarOpen = grammarOpenState[1];
  const tickState = useState(0);
  const setTick = tickState[1];
  const rootRef = React.useRef(null);

  useEffect(function () { saveState(state); }, [state]);
  useEffect(function () {
    if (rootRef.current) rootRef.current.scrollTop = 0;
  }, [tab]);
  useEffect(function () {
    if (!ctx.locale || typeof ctx.locale.subscribe !== 'function') return undefined;
    return ctx.locale.subscribe(function () { setTick(function (v) { return v + 1; }); });
  }, []);
  useEffect(function () {
    loadVoices();
    if (window.speechSynthesis) {
      window.speechSynthesis.onvoiceschanged = function () { loadVoices(); };
    }
    return function () { stopSpeak(); };
  }, []);

  function update(fn) { setState(function (prev) { return fn(prev); }); }

  function answerWord(w, result, isNew) {
    update(function (prev) {
      const words = reviewWord(prev, w, result);
      const key = dayKey();
      const day = Object.assign(emptyDay(), prev.daily[key] || {});
      if (isNew) day.newWords += 1; else day.reviews += 1;
      day.minutes = (day.minutes || 0) + 0.4;
      return Object.assign({}, prev, { words: words, daily: Object.assign({}, prev.daily, { [key]: day }) });
    });
  }

  function recordGrammar(id, ok) {
    update(function (prev) {
      const key = dayKey();
      const old = prev.grammar[id] || { r: 0, w: 0, lastDay: '' };
      const next = {
        r: (old.r || 0) + (ok ? 1 : 0),
        w: (old.w || 0) + (ok ? 0 : 1),
        at: Date.now(),
        lastDay: old.lastDay,
      };
      const day = Object.assign(emptyDay(), prev.daily[key] || {});
      if (next.lastDay !== key) { day.grammar += 1; next.lastDay = key; }
      day.minutes = (day.minutes || 0) + 1;
      return Object.assign({}, prev, {
        grammar: Object.assign({}, prev.grammar, { [id]: next }),
        daily: Object.assign({}, prev.daily, { [key]: day }),
      });
    });
  }

  function recordSpeaking(id, scoreValue) {
    update(function (prev) {
      const key = dayKey();
      const old = prev.speaking[id] || { count: 0 };
      const day = Object.assign(emptyDay(), prev.daily[key] || {});
      day.speaking += 1;
      day.minutes = (day.minutes || 0) + 1;
      return Object.assign({}, prev, {
        speaking: Object.assign({}, prev.speaking, {
          [id]: { score: scoreValue, at: Date.now(), count: (old.count || 0) + 1 },
        }),
        daily: Object.assign({}, prev.daily, { [key]: day }),
      });
    });
  }

  function recordPaper(rec) {
    update(function (prev) {
      const list = Array.isArray(prev.papers) ? prev.papers.slice() : [];
      list.push(rec);
      const key = dayKey();
      const day = Object.assign(emptyDay(), prev.daily[key] || {});
      day.minutes = (day.minutes || 0) + (rec.minutes || 0);
      return Object.assign({}, prev, { papers: list, daily: Object.assign({}, prev.daily, { [key]: day }) });
    });
  }

  function reset() {
    if (window.confirm(t('resetConfirm'))) setState(defaultState());
  }

  const days = daysUntil(state.examDate);
  const theme = state.settings.theme === 'dark' ? 'dark' : 'light';
  function toggleTheme() {
    update(function (prev) {
      return Object.assign({}, prev, {
        settings: Object.assign({}, prev.settings, {
          theme: prev.settings.theme === 'dark' ? 'light' : 'dark',
        }),
      });
    });
  }
  const tabs = [
    { key: 'today', label: t('tab.today') },
    { key: 'words', label: t('tab.words') },
    { key: 'grammar', label: t('tab.grammar') },
    { key: 'speaking', label: t('tab.speaking') },
    { key: 'papers', label: t('tab.papers') },
    { key: 'writing', label: t('tab.writing') },
    { key: 'wrong', label: t('tab.wrong') },
  ];

  /* 所有面板常驻，切标签不会中断套卷计时、背词进度和录音状态。 */
  const views = {
    today: h(Today, { t: t, state: state, update: update, goTab: setTab, reset: reset }),
    words: h(Words, { t: t, state: state, answerWord: answerWord }),
    grammar: h(Grammar, { t: t, state: state, recordGrammar: recordGrammar, open: grammarOpen, setOpen: setGrammarOpen }),
    speaking: h(Speaking, { t: t, state: state, recordSpeaking: recordSpeaking }),
    papers: h(Papers, { t: t, state: state, recordPaper: recordPaper, goWriting: function () { setTab('writing'); } }),
    writing: h(Writing, { t: t, ctx: ctx, state: state, update: update }),
    wrong: h(Mistakes, {
      t: t, state: state, goTab: setTab,
      setGrammarOpen: function (id) { setGrammarOpen(id); setTab('grammar'); },
    }),
  };

  return h('div', { className: 'eng-root', ref: rootRef, 'data-theme': theme },
    h('style', null, CSS),
    h('div', { className: 'eng-wrap' },
      h('div', { className: 'eng-head' },
        h('div', { className: 'eng-logo' }, 'EN'),
        h('div', { className: 'eng-titles' },
          h('h1', null, t('title')),
          h('p', null, t('subtitle'))),
        h('span', { className: 'eng-spacer' }),
        h('div', { className: 'eng-count' },
          h('b', null, days === null ? '—' : String(Math.max(days, 0))),
          h('span', null, '天 · 目标 ' + state.target + ' 分')),
        h('button', {
          type: 'button',
          className: 'eng-theme-btn',
          title: theme === 'light' ? '切换到深色' : '切换到浅色',
          onClick: toggleTheme,
        }, theme === 'light' ? '☾' : '☀')),

      h('div', { className: 'eng-tabs' },
        tabs.map(function (item) {
          return h('button', {
            key: item.key, type: 'button', className: 'eng-tab',
            'data-active': tab === item.key ? 'true' : 'false',
            onClick: function () { setTab(item.key); },
          }, item.label);
        })),

      tabs.map(function (item) {
        return h('div', {
          key: item.key,
          style: { display: tab === item.key ? '' : 'none' },
        }, views[item.key]);
      })));
}

/* ---------- 手机版（PWA）启动 ---------- */
const PWA_CTX = { get: function () { return null; } };

function pwaTranslate(key) {
  return DICT.zh[key] || key;
}

(function mount() {
  const node = document.getElementById('root');
  if (!node || !window.ReactDOM || !window.React) return;
  window.ReactDOM.createRoot(node).render(h(CoachPage, { t: pwaTranslate, ctx: PWA_CTX }));
})();

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').catch(function () { /* ignore */ });
  });
}
})();
</script>
